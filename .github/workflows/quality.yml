name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-only placeholders. CI does not authenticate or query a live project.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Learner state tests
        run: node --experimental-strip-types scripts/test-the-ten.mjs

      - name: Build
        run: npm run build
